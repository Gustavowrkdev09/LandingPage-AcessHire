<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/cadastroStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
        <link rel="icon" type="image/png" href="../assets/iconLogo.png">
    <title>AccesHire</title>
</head>

<body>
    <nav>
        <div class="navLogo">
            <a href="../index.html">
                <h1>Access<span>Hire</span></h1>
            </a>
        </div>
    </nav>

    <div class="cadContent">
        <h1>Criar uma nova conta</h1>
        <a href="../screens/index.html">
            <p>Já tem uma conta? Login</p>
        </a>
    </div>

    <div class="formField">
        <label>Nome</label>
        <input type="text" placeholder="Seu nome completo">
    </div>
    <div class="formField">
        <label>Email</label>
        <input type="email" placeholder="Seu endereço Email">
    </div>
    <div class="formField">
        <label>Senha</label>
        <input type="password" placeholder="Sua senha">
    </div>
    <div class="formField">
        <label>Comfirmar Senha</label>
        <input type="password" placeholder="Confirme sua senha">
    </div>
    <div class="formField">
        <label>Data de Nascimento</label>
        <input type="date" placeholder="">
    </div>
    <div class="cadButton">
        <a href="">
            <button>Criar Conta</button>
        </a>
    </div>
</body>

</html>
